<style>
  .psu { width: min(640px, 100%); margin: 0 auto; font-family: system-ui, sans-serif; }
  .psu svg { display: block; width: 100%; height: auto; }
  .psu text { font-family: system-ui, sans-serif; }
  .brand { font: 700 15px system-ui, sans-serif; letter-spacing: .14em; fill: #e8eaec; }
  .model { font: 500 13px ui-monospace, Menlo, monospace; fill: #8a939c; }
  .lbl { font: 700 12px system-ui, sans-serif; letter-spacing: .16em; fill: #aab3bc; }
  .tag { font: 700 12px system-ui, sans-serif; letter-spacing: .12em; fill: #aab3bc; }
  .unit { font: 700 16px system-ui, sans-serif; text-anchor: end; }
  .lcd-bg { fill: #07090a; stroke: #000; stroke-width: 2; }
  .lcd-v { --seg-on: #5cff8f; --seg-off: #0f2417; }
  .lcd-a { --seg-on: #ffb02e; --seg-off: #2a1e08; }
  .lcd .unit, .lcd .dot { fill: var(--seg-on); }
  .lcd .d7 rect { filter: drop-shadow(0 0 3px var(--seg-glow, transparent)); }
  .lcd-v .d7[data-value] { --seg-glow: #5cff8f88; }
  .lcd-a .d7[data-value] { --seg-glow: #ffb02e88; }
  .d7 rect { fill: var(--seg-off); transition: fill .06s; }
  .d7[data-value="0"] :is(.sa, .sb, .sc, .sd, .se, .sf) { fill: var(--seg-on); }
  .d7[data-value="1"] :is(.sb, .sc) { fill: var(--seg-on); }
  .d7[data-value="2"] :is(.sa, .sb, .sd, .se, .sg) { fill: var(--seg-on); }
  .d7[data-value="3"] :is(.sa, .sb, .sc, .sd, .sg) { fill: var(--seg-on); }
  .d7[data-value="4"] :is(.sb, .sc, .sf, .sg) { fill: var(--seg-on); }
  .d7[data-value="5"] :is(.sa, .sc, .sd, .sf, .sg) { fill: var(--seg-on); }
  .d7[data-value="6"] :is(.sa, .sc, .sd, .se, .sf, .sg) { fill: var(--seg-on); }
  .d7[data-value="7"] :is(.sa, .sb, .sc) { fill: var(--seg-on); }
  .d7[data-value="8"] :is(.sa, .sb, .sc, .sd, .se, .sf, .sg) { fill: var(--seg-on); }
  .d7[data-value="9"] :is(.sa, .sb, .sc, .sd, .sf, .sg) { fill: var(--seg-on); }
  .d7[data-value="-"] :is(.sg) { fill: var(--seg-on); }
  .led circle { fill: #2a2f35; stroke: #0d0f12; stroke-width: 2; transition: fill .2s; }
  .led[data-value=true] circle { fill: #38e07a; filter: drop-shadow(0 0 5px #38e07a); }
  .knob { transform: rotate(calc((clamp(0, var(--value, 0), 30) / 30 * 270 - 135) * 1deg)); transition: transform .15s linear; }
  .verdict { display: flex; align-items: baseline; gap: 8px; margin-top: 10px; padding: 10px 14px; border-radius: 10px; background: #f2f3f4; color: #222; font-size: 15px; }
  .verdict b { font: 700 22px ui-monospace, Menlo, monospace; }
  .verdict .limit { color: #6b7280; margin-left: auto; }
  .verdict .chip { font-weight: 700; padding: 2px 10px; border-radius: 999px; background: #d1d5db; color: #374151; }
  .verdict .chip::after { content: "WAITING"; }
  .verdict[data-outcome=PASS] .chip { background: #16a34a; color: #fff; }
  .verdict[data-outcome=PASS] .chip::after { content: "PASS"; }
  .verdict[data-outcome=FAIL] .chip { background: #dc2626; color: #fff; }
  .verdict[data-outcome=FAIL] .chip::after { content: "FAIL"; }
</style>
